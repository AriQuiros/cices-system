spring.application.name=backend_cices_system
server.port=8080

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521:XE}
spring.datasource.username=${DB_USERNAME:CICES}
spring.datasource.password=${DB_PASSWORD:cices123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# JWT
security.jwt.secret=${JWT_SECRET:change-this}
security.jwt.exp-hours=${JWT_EXPIRATION:8}
spring.jpa.properties.hibernate.id.new_generator_mappings=true

# Configuraci�n para los archivos
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=600MB

logging.level.org.hibernate=ERROR
logging.level.root=INFO

logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.example.backend_cices_system=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

security.login.max-attempts=5
security.login.block-minutes=2

spring.datasource.hikari.connection-init-sql=ALTER SESSION SET NLS_LANGUAGE='SPANISH' NLS_LENGTH_SEMANTICS='CHAR'
spring.jpa.properties.hibernate.connection.defaultNChar=true

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}