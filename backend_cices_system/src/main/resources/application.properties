spring.application.name=backend_cices_system
server.port=8080
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:XE
spring.datasource.username=cices
spring.datasource.password=cices123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# JWT
security.jwt.secret=change-this
security.jwt.exp-hours=8
spring.jpa.properties.hibernate.id.new_generator_mappings=true

# Configuraci�n para los archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

logging.level.org.springframework=DEBUG
logging.level.org.hibernate=ERROR
logging.level.root=INFO

security.login.max-attempts=5
security.login.block-minutes=2

spring.datasource.hikari.connection-init-sql=ALTER SESSION SET NLS_LANGUAGE='SPANISH' NLS_LENGTH_SEMANTICS='CHAR'
spring.jpa.properties.hibernate.connection.defaultNChar=true

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
